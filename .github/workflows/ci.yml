name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check src test website/scripts
      - name: Jinja lint (j2lint; indentation/single-line rules are house-style exceptions)
        run: uv run j2lint --ignore jinja-statements-indentation single-statement-per-line -- src/dbml_sharepoint/templates
      - name: Type-check
        run: uv run mypy
      - name: Tests
        # Two flags only; everything else is configured in pyproject.toml, so
        # a local run and this one measure the same thing.
        #
        # `--cov` is off by default locally because it roughly doubles the
        # suite. `--check-finding-reachability` is off by default because it is
        # only meaningful over a WHOLE run -- on `pytest test/test_joins.py` it
        # would report almost every rule unreached, which is noise, not a
        # finding. The two are not redundant: coverage is an aggregate floor
        # and cannot see one rule stop firing (measured -- deleting the only
        # test that fires `display_title_too_long` leaves coverage at 95.21%,
        # over the floor, while the reachability gate names the rule).
        run: uv run pytest --cov --check-finding-reachability
      - name: Build both examples end-to-end
        run: |
          uv run dbml-sharepoint build --schema examples/minimal/schema.dbml --mapping examples/minimal/mapping.yaml --release examples/minimal/release.yaml --site-url https://example.sharepoint.com/sites/ci --site-role default --out examples/minimal/build
          uv run dbml-sharepoint build --schema examples/project-tracker/schema.dbml --mapping examples/project-tracker/mapping.yaml --release examples/project-tracker/release.yaml --site-url https://example.sharepoint.com/sites/ci --site-role default --out examples/project-tracker/build
      - name: Syntax-check the generated scripts
        shell: bash
        # `node --check <file>` cannot read these: the scripts ship as
        # `.js.txt` so an operator can open them instead of Windows Script
        # Host executing them, and node refuses an unknown extension with
        # ERR_UNKNOWN_FILE_EXTENSION before it ever parses the file. Feed
        # them on stdin and name the dialect instead -- same parse, same
        # non-zero exit on a syntax error, no dependence on the filename.
        run: |
          set -euo pipefail
          found=0
          for f in examples/minimal/build/*.js.txt \
                   examples/project-tracker/build/*.js.txt; do
            node --check --input-type=commonjs < "$f"
            found=$((found + 1))
          done
          echo "Syntax-checked $found script(s)."
          # A glob that matches nothing would otherwise pass silently --
          # which is precisely how a rename like this ships broken.
          test "$found" -gt 0
      - name: Generate reporting queries end-to-end
        run: uv run dbml-sharepoint report --schema examples/project-tracker/schema.dbml --mapping examples/project-tracker/mapping.yaml --release examples/project-tracker/release.yaml --site-role default --out examples/project-tracker/reports
      - name: Build every solution template end-to-end
        shell: bash
        # Discovered, never listed. A hardcoded roster fails open: a new
        # template is simply never built, and CI stays green saying so.
        run: |
          set -euo pipefail
          # The solution templates live inside the package so the wizard can
          # offer them to somebody who never cloned this repository.
          sol=src/dbml_sharepoint/solutions
          found=0
          for schema in "$sol"/*/10-design/schema.dbml; do
            t="$(basename "$(dirname "$(dirname "$schema")")")"
            found=$((found + 1))
            echo "::group::$t"
            # Build OUTSIDE the package. In-place output would write into the
            # installable tree, where a stray build/ directory can be picked
            # up by the wheel.
            uv run dbml-sharepoint build \
              --schema "$schema" \
              --mapping "$sol/$t/20-configure/mapping.yaml" \
              --release "$sol/$t/20-configure/release.yaml" \
              --site-url https://example.sharepoint.com/sites/ci \
              --site-role default \
              --out "build/$t"
            echo "::endgroup::"
          done
          echo "Built $found template(s)."
          # A glob that matches nothing would otherwise pass silently.
          test "$found" -gt 0
      - name: Build every seeded bundle (discovered, never listed)
        shell: bash
        # A hardcoded roster fails open: a new demo_items consumer is simply
        # never seeded, and CI stays green saying so.
        run: |
          set -euo pipefail
          # The library's own size, counted the same way the build step
          # above counts it, so neither side of the assertion below is a
          # number somebody has to remember to update.
          sol=src/dbml_sharepoint/solutions
          expected=0
          for schema in "$sol"/*/10-design/schema.dbml; do
            expected=$((expected + 1))
          done
          found=0
          for mapping in "$sol"/*/20-configure/mapping.yaml; do
            grep -q '^demo_items:' "$mapping" || continue
            t="$(basename "$(dirname "$(dirname "$mapping")")")"
            found=$((found + 1))
            echo "::group::$t"
            uv run dbml-sharepoint build \
              --schema "$sol/$t/10-design/schema.dbml" \
              --mapping "$mapping" \
              --release "$sol/$t/20-configure/release.yaml" \
              --site-url https://example.sharepoint.com/sites/ci \
              --site-role default \
              --seed \
              --out "build/$t-seed"
            node --check --input-type=commonjs < "build/$t-seed/demo-data.js.txt"
            echo "::endgroup::"
          done
          echo "Seeded $found of $expected template(s)."
          # Every template ships demo_items — it is part of the family
          # standard, not a feature some of them happen to use — so the
          # honest assertion is equality, not a floor. A floor written when
          # two templates seeded stays green while twenty-seven stop, which
          # is the same open failure a hardcoded roster gives you, spelled
          # as a number instead of a list.
          test "$found" -eq "$expected"

  docs:
    # onBrokenLinks/onBrokenMarkdownLinks are 'throw', so this build is
    # the cross-link integrity gate for the whole docs site.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build docs site
        working-directory: website
        run: |
          npm ci
          npm run build
