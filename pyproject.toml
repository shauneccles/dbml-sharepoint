[project]
name = "dbml-sharepoint"
version = "0.4.0"
description = "Turn a DBML schema + YAML mapping into an idempotent, fail-closed browser-console deploy.js that provisions SharePoint Online lists, with no tenant admin, no premium licence, and no install on the target."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Shaun Eccles-Smith" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "sharepoint",
  "dbml",
  "provisioning",
  "sharepoint-online",
  "lists",
  "schema",
  "deployment",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydbml>=1.1.0,<2.0",
  # The CLI imports pyparsing directly. PyDBML 1.2.1 also still uses its
  # pre-PEP8 aliases, which warn in 3.3 and are due for removal in 4.0.
  # Lift this cap once PyDBML has migrated to the snake_case API.
  "pyparsing>=3.0.0,<3.3",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "typer>=0.12.0",
  "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/shauneccles/dbml-sharepoint"
Documentation = "https://shauneccles.github.io/dbml-sharepoint/"
Repository = "https://github.com/shauneccles/dbml-sharepoint"
Issues = "https://github.com/shauneccles/dbml-sharepoint/issues"

[project.scripts]
dbml-sharepoint = "dbml_sharepoint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbml_sharepoint"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.16.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
  "j2lint>=1.2.0",
  # The git-hook runner. Pinned here for the same reason as every other gate:
  # `uv run prek` cannot drift from the version a contributor happens to have.
  "prek>=0.4.11",
  "hypothesis>=6.100",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# ANN, BLE, C901, PLC0415 and TID252 were adopted together as ratchets (#165).
# The first three stood at ZERO violations at the time, so they cost nothing to
# turn on and can now never regress -- which is the entire point. A rule that is
# enforced cannot rot; a rule that lives in a document can.
select = [
  "A", "ANN", "B", "BLE", "C4", "C901", "DTZ", "E", "F", "FURB", "I", "ISC",
  "N", "PIE", "PLC0415", "PTH", "RET", "RUF", "S", "SIM", "T20", "TID252",
  "UP", "W",
]
ignore = [
  # MEASURED 2026-08-17: 58 sites across the linted roots, most of them on a
  # genuine YAML, JSON, Jinja-context or untyped-dependency boundary -- `raw`
  # straight off `yaml.safe_load` is honestly Any. The rest of ANN is at zero
  # and IS enforced, so every signature stays annotated; only the `Any` itself
  # is allowed. The cluster this comment used to single out, `bundle: Any,
  # schema: Any` across extension.py's hooks, is closed: those hooks now name
  # the types this package defines, and `test_public_api.py` gates them,
  # because `Any` satisfies the protocol in both directions and conformance
  # tests cannot see it come back.
  "ANN401",
  "B008",  # typer.Option in defaults is the framework idiom
  "C408",  # dict(key=...) literals are deliberate where used
]

# NOT adopted, recorded so they are not re-litigated:
#   TRY003 / EM101 / EM102 (105 sites) -- this project's long, operator-facing
#     error prose IS the product; enforcing them means inventing 95 exception
#     subclasses to no benefit.
#   TRY004 (26 sites) -- raising ValueError after an isinstance check is
#     deliberate: every config failure funnels into one ValueError-shaped
#     refusal via `_CONFIG_ERRORS` in cli.py.
#   FA100 / FA102 -- both push TOWARDS `from __future__ import annotations`,
#     which is the wrong direction here, and neither can remove one. See #164:
#     PEP 649 shipped in 3.14, this project supports 3.13, so the quoted
#     forward references are current practice, not legacy.

[tool.ruff.lint.flake8-tidy-imports]
# Default is "parents", which bans `..` and leaves `from . import x` alone.
# There was exactly one such import and it had no reason to be relative.
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# A RATCHET, exactly like coverage's `fail_under` and `_reachability`'s
# NOT_YET_REACHED: set ABOVE today's worst so it blocks nothing now, and
# lowered as the offenders are split. Never raised to make a build pass.
#
# 72 is `analysis/checks/_structure.py::check`. The other two over 40 are
# `_views.py::check` (58) and `_formatting.py::check` (48); #168 decomposes
# all three, and each PR that lands should bring this number down with it.
#
# Deliberately NOT the default of 10. That flags 25 functions at once, which
# blocks every unrelated change until a large refactor lands -- so it would be
# turned off again within a week, and the rule would teach nothing.
max-complexity = 72

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts. PLC0415: 159 function-level imports in the test tree,
# 67 of them in test_jsgen.py -- a mechanical cleanup tracked in #172, not a
# gate. PLC0415 IS enforced in src/, where the nine remaining sites each carry
# a `noqa` and a reason: four in `wizard.py` break a genuine cycle with `cli.py`
# (#171), and five in `bundle.py` keep that module importable for its packaging
# helpers without pulling in the whole generation stack.
"test/**" = ["S101", "PLC0415"]
"website/scripts/**" = ["T20", "PLC0415"] # generator scripts report via print
"test/manual/render_probes.py" = ["T20"]     # generator script, reports via print
"test/manual/make_threshold_rows.py" = ["T20"]  # generator script, reports via print
"test/test_probes.py" = ["S603", "S607"]     # runs `node --check` on our own files
"test/test_family_count_prose.py" = ["S603", "S607"]  # runs `git ls-files` on this repo
"test/test_text_encoding.py" = ["S603", "S607"]       # runs `git ls-files` on this repo
# Runs `git diff` and this project's own pytest; T20 because the printed
# verdicts ARE the record the CI log keeps.
"scripts/**" = ["S603", "S607", "T20"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "test", "website/scripts", "scripts"]

[[tool.mypy.overrides]]
module = "pydbml.*"
ignore_missing_imports = true

[tool.coverage.run]
# Measured on the package, not on the test tree: a test file that never runs
# is a dead test, which is a different problem with a different answer.
source = ["dbml_sharepoint"]
# Branch coverage, deliberately. Line coverage cannot tell a rule that fires
# from one whose `if` is only ever false, and this codebase is mostly
# fail-closed guards -- the branch that never gets taken IS the thing worth
# seeing. It is also what showed 34 finding codes with a construction site no
# test reaches (#98).
branch = true
# pytest runs with `-n auto`; each xdist worker writes its own data file and
# pytest-cov combines them.
parallel = true

[tool.coverage.report]
show_missing = true
# Fully-covered files are noise in a 100-file report; what is missing is the
# whole point of reading it.
skip_covered = true
exclude_also = [
  # `if TYPE_CHECKING:` bodies never execute at runtime by design.
  "if TYPE_CHECKING:",
  # A `@overload` stub has no body to run.
  "@overload",
  # Unreachable-by-construction guards. These are written as belt-and-braces
  # in a fail-closed codebase and are meant never to be hit.
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
# A ratchet, not a target. Raised as the real number moves, never lowered to
# make a build pass. 94.71% when coverage was turned on; 95.25% once the
# unreached validator rules got tests (#98), so this is 95.
#
# Deliberately NOT 100. A number that can only be held by writing tests for
# unreachable defensive branches buys nothing and teaches people to write
# tests that assert nothing, which is worse than the gap it closed.
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["test"]
# `-n auto` distributes across cores; the suite is ~1300 short tests with no
# single slow one, which is the shape that parallelises well. Measured on a
# 24-core machine: 17.4s serial, 4.8s here.
#
# --maxprocesses caps it deliberately. Uncapped `auto` was SLOWER than 8 (6.6s
# vs 4.8s) because 24 workers spend more on startup than they save. The cap is
# inert on CI runners, which have fewer cores than the cap anyway.
#
# Pass `-n0` to disable when you need `--pdb`, readable ordering, or to debug a
# single test: `uv run pytest -n0 test/test_joins.py`.
addopts = "-ra -q --strict-markers -n auto --maxprocesses 8"
filterwarnings = ["error"]
markers = [
  # The template family-standard sweep (test_template_standard.py): 22 rules,
  # thirteen parametrised across the library, 399 of the 1293 cases. Skip it
  # for a quieter run while iterating on something else:
  #     uv run pytest -m "not conformance"
  # For FOCUS, not speed -- measured at 4.65s against 4.66s for the full suite,
  # because -n auto already spreads those cases and they are not the critical
  # path. CI never filters: the whole suite runs on every change.
  "conformance: the template family-standard sweep, parametrised over every template",
]
